          <p><strong>Also known as:</strong> Hellyoshaqiqie, Helyos, Helios, Iyos, Hellyos Ageng, Hellyos Haqiqie, Ageng Haqiqie, Haqiqie, Haqiqi</p>

        <section>
          <h2>About Hellyos Ageng Haqiqie (Hellyos / Hellyoshaqiqie)</h2>
          <p><strong>Hellyos Ageng Haqiqie</strong> (dikenal juga sebagai <strong>Hellyos</strong>, <strong>Ageng</strong>, <strong>Hellyos Ageng</strong>, <strong>Haqiqie</strong>, <strong>Helios</strong>, atau <strong>Hellyoshaqiqie</strong>) adalah seorang Full-Stack Software Engineer, AI Engineer, dan Systems Architect asal Surabaya, Jawa Timur, Indonesia. Saat ini beliau menempuh pendidikan di program studi <strong>Teknik Robotika dan Kecerdasan Buatan (TRKB)</strong> di <strong>Universitas Airlangga (UNAIR)</strong> Surabaya, serta menjabat sebagai <strong>Chief Information Officer (CIO)</strong> di <strong>Vorce</strong>.</p>
          <p>Hellyos merupakan <strong>Gold Medalist (Peraih Medali Emas) FIKSI 2024</strong> (Festival Inovasi dan Kewirausahaan Siswa Indonesia) kategori Teknologi Digital yang diselenggarakan oleh Balai Pengembangan Talenta Indonesia (BPTI) dan Pusat Prestasi Nasional (Puspresnas), Kementerian Pendidikan, Kebudayaan, Riset, dan Teknologi (Kemendikbudristek) Republik Indonesia melalui karya inovasi ekosistem telematika pintar <strong>Velinked</strong>.</p>
          <p>Hellyos menggabungkan keahlian mendalam di bidang Artificial Intelligence (AI), Machine Learning, Internet of Things (IoT), Robotics, dan Cloud Systems Architecture. Portofolionya mencakup arsitektur produksi berskala enterprise, platform berbasis React, Next.js, TypeScript, microservices Golang dan Python, Firebase Firestore, serta infrastruktur Google Cloud Platform (GCP).</p>
        </section>

        <section>
          <h2>Technical Expertise &amp; Skills</h2>
          <p>Keahlian teknik dan domain spesialisasi Hellyos Ageng Haqiqie:</p>
          <ul>
            <li><strong>Teknik Robotika dan Kecerdasan Buatan (TRKB):</strong> Autonomous systems, sensor telemetry, computer vision, deep learning, embedded robotics, and edge computing.</li>
            <li><strong>Full-Stack Web Development:</strong> React, Next.js, TypeScript, Node.js, Vite, HTML5, Tailwind CSS.</li>
            <li><strong>Backend Engineering &amp; Architecture:</strong> Golang, Python, REST APIs, GraphQL, Microservices Architecture.</li>
            <li><strong>Artificial Intelligence &amp; Machine Learning:</strong> TensorFlow, OpenCV, Natural Language Processing, Predictive Analytics, LLM Agents.</li>
            <li><strong>Robotics &amp; Embedded Systems:</strong> LoRaWAN, ESP32, MQTT, Biometric Telemetry, Marine &amp; Automotive IoT.</li>
            <li><strong>Cloud Computing &amp; DevOps:</strong> Google Cloud Platform (GCP), Cloud Run, Firebase, Docker, CI/CD, Vercel.</li>
            <li><strong>Blockchain &amp; Web3:</strong> Smart Contracts, ERC-1155, Tokenization, Carbon Credit Systems.</li>
            <li><strong>Executive Leadership:</strong> Chief Information Officer (CIO) at Vorce, Project Management, Product Roadmap Strategy.</li>
          </ul>
        </section>

        <section>
          <h2>Featured Projects &amp; Case Studies</h2>
          <ul>
            <li><a href="/project/climatix"><strong>ClimatiX — Climate Tech &amp; Carbon Credit Ecosystem:</strong></a> Ekosistem teknologi iklim berbasis IoT, AI carbon analytics, dan tokenisasi blockchain ERC-1155. Juara Best Presentation Indonesia Green Jobs Initiative Competition 2026.</li>
            <li><a href="/project/sms-vest"><strong>SMS-Vest — Smart Marine Safety Vest Ecosystem:</strong></a> Rompi keselamatan pintar maritim berbasis IoT LoRa telemetry (jarak hingga 25 km) dan diagnosis AI untuk nelayan tradisional. Program PKM-KC.</li>
            <li><a href="/project/vorce-platform"><strong>VORCE — Workforce Intelligence &amp; Operations Platform:</strong></a> Platform intelijen operasional dan produktivitas tenaga kerja enterprise dengan telemetri desktop real-time.</li>
            <li><a href="/project/vorce-hr-management"><strong>VORCE — Enterprise Workforce &amp; HR Management Platform:</strong></a> Ekosistem hybrid HR dengan GPS/Face ID attendance, cuti real-time, dan OCR klaim otomatis.</li>
            <li><a href="/project/vlinked-desktop-agent"><strong>vLinked — Desktop Control Agent:</strong></a> Agen pemantau aktivitas dan performa perangkat desktop lintas platform (macOS/Windows/Linux) berbasis Electron.</li>
            <li><a href="/project/fleet-management"><strong>Smart Fleet Management (Velinked):</strong></a> Ekosistem pelacak armada IoT dengan telemetri GPS dan scoring perilaku pengemudi. Karya peraih Medali Emas FIKSI 2024.</li>
            <li><a href="/project/dermdoc"><strong>DermDoc — AI Dermatology Assistant:</strong></a> Asisten diagnostik dermatologi bertenaga computer vision AI.</li>
            <li><a href="/project/smart-home"><strong>Smart Home IoT Ecosystem:</strong></a> Solusi otomasi rumah pintar dengan pemantauan lingkungan real-time.</li>
            <li><a href="/project/smart-vehicle"><strong>Smart Vehicle — OBD Telemetry:</strong></a> Platform telemetri diagnostik kendaraan dengan integrasi OBD-II.</li>
            <li><a href="/project/driver-dashboard"><strong>Driver Dashboard — Telematics Interface:</strong></a> Dashboard visual telemetri armada untuk analitik performa kendaraan secara live.</li>
