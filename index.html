          <p>Currently pursuing a degree in Robotics and Artificial Intelligence Engineering at Universitas Airlangga (UNAIR), Hellyos combines deep academic knowledge in AI and robotics with practical engineering expertise. He is passionate about creating seamless integration layers between secure databases, backend APIs, and beautiful control interfaces.</p>
